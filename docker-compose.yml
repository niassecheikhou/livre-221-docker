services:
  db:
    image: postgres:16-alpine
    container_name: livre221docker
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livre221docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livre221docker}
      POSTGRES_DB: ${POSTGRES_DB:-livre221docker}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livre221-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://livre221docker:livre221docker@db:5432/livre221docker?schema=public}

volumes:
  postgres_data:
